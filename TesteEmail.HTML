 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Confirmação de Cadastro</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px;">
    <div style="max-width: 600px; margin: auto; background: #ffffff; border-radius: 8px; padding: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h2 style="color: #333;">Confirme seu cadastro</h2>
        <p style="color: #555;">
            Olá, obrigado por se registrar em nosso Banco, esperamos que seja uma boa aventura! 
        </p>

<div style="display: flex; justify-content: center; align-items: center; flex-direction: column;">
<p>
Para ativar sua conta, clique no botão abaixo e confirme seu cadastro.
</p>

        <a href="https://suaaplicacao.com/confirmacao?token={0}&email={1}&accepted=true"
           style="display: inline-block; text-align: center; padding: 12px 24px; background-color: #4CAF50; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold;">
            Confirmar Cadastro
        </a>

	<p style="margin-top: 20px; color: #777; font-size: 14px;">
            Se você não realizou este cadastro, pode ignorar este e-mail.
        </p>
</div>
    </div>
